[versions]
agp = "8.13.2"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.2"
composeBom = "2025.06.01"
activity = "1.10.1"
lifecycle = "2.9.1"
room = "2.7.2"
coroutines = "1.10.2"
readium = "3.1.2"
datastore = "1.1.7"
exif = "1.3.6"
mlkitText = "16.0.1"
mlkitTranslate = "17.0.3"
pdfboxAndroid = "2.0.27.0"
bouncyCastle = "1.86"
asm = "9.8"
junrar = "8.1.2"
slf4j = "2.0.17"

[libraries]
junrar = { module = "com.github.junrar:junrar", version.ref = "junrar" }
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfboxAndroid" }
bcprov = { module = "org.bouncycastle:bcprov-jdk15to18", version.ref = "bouncyCastle" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk15to18", version.ref = "bouncyCastle" }
bcutil = { module = "org.bouncycastle:bcutil-jdk15to18", version.ref = "bouncyCastle" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitText" }
mlkit-translate = { module = "com.google.mlkit:translate", version.ref = "mlkitTranslate" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exif" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
readium-shared = { module = "org.readium.kotlin-toolkit:readium-shared", version.ref = "readium" }
readium-streamer = { module = "org.readium.kotlin-toolkit:readium-streamer", version.ref = "readium" }
readium-navigator = { module = "org.readium.kotlin-toolkit:readium-navigator", version.ref = "readium" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version = "1.8.6" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version = "2.1.5" }
junit = { module = "junit:junit", version = "4.13.2" }
robolectric = { module = "org.robolectric:robolectric", version = "4.15.1" }
androidx-test-core = { module = "androidx.test:core-ktx", version = "1.6.1" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.6.2" }
androidx-test-junit = { module = "androidx.test.ext:junit-ktx", version = "1.2.1" }
androidx-compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
